# 商城站点：静态资源 + 反代 /api、/auth、/oauth2 到 backend（compose 内网服务名）
# 唯一入口是 gateway（按 Host 分流到本站点）；本文件不直接对外暴露
# TLS 在外层（Cloudflare/宿主反代）终止：已带 X-Forwarded-Proto 则透传，否则取本机 scheme
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 深链（如 /orders）fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Spring Security OAuth2 授权发起端点（/oauth2/authorization/logto），与 vite 开发代理保持对称
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
