# 部署：拉 GHCR 已发布镜像运行；本地构建镜像用 mise run image-*，不归 compose 管
# 前置：部署机 docker login ghcr.io；本目录放好 application.yml（后端外置配置，含外部 MySQL
#       连接与 OIDC 参数，参照 backend/config/application.example.yml 填写）与 gateway.nginx.conf
# MySQL 用外部实例，不进 compose；gateway 是唯一入口，其余服务不映射宿主端口
# 依赖 Compose ≥ 2.17（depends_on 的 restart 字段）：升级某服务时其被依赖方自动重启以重新解析
# nginx 上游 IP（proxy_pass 用主机名且未配 resolver，会在配置加载时永久缓存旧 IP，否则升级后 502）
services:
  gateway:
    image: nginx:1.29-alpine
    container_name: mintpop-shop-gateway
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"   # 宿主端口参数化（右侧容器端口固定）
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
      admin:
        # 需要这条依赖：gateway 的 nginx 在加载配置时要解析 proxy_pass http://admin:80 里的主机名，
        # admin 容器不存在/未启动时该主机名不可解析，nginx 会直接拒绝启动。
        # 用 service_started 而非 service_healthy：只要求 admin 进入 running（满足 nginx 启动期
        # 的主机名解析这一最小条件），不等待健康检查通过——避免管理端健康检查慢或不健康时连累
        # 网关不启动。注意它挡不住拉镜像失败/ADMIN_TAG 打错等情况：那种情况 admin 根本不会进入
        # running，service_started 同样不满足，gateway 依旧会随之启动失败。
        condition: service_started
        restart: true
    healthcheck:
      # 探自身 80：会经 default_server 落到商城，通即代表网关与上游都活着
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: ghcr.io/mintpopai/mintpop-shop/frontend:${FRONTEND_TAG:-latest}   # 版本参数化
    container_name: mintpop-shop-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  admin:
    image: ghcr.io/mintpopai/mintpop-shop/admin:${ADMIN_TAG:-latest}   # 版本参数化
    container_name: mintpop-shop-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    image: ghcr.io/mintpopai/mintpop-shop/backend:${BACKEND_TAG:-latest}   # 版本参数化
    container_name: mintpop-shop-backend
    restart: unless-stopped
    volumes:
      - ./application.yml:/app/config/application.yml:ro
    healthcheck:
      # 探公开业务接口（依赖 DB 就绪，即「真可服务」语义）
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/groups >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
