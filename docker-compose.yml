# 部署：拉 GHCR 已发布镜像运行；本地构建镜像用 mise run image-*，不归 compose 管
# 前置：部署机 docker login ghcr.io；本目录放好 application.yml（后端外置配置，含外部 MySQL
#       连接与 OIDC 参数，参照 backend/config/application.example.yml 填写）
# MySQL 用外部实例，不进 compose
# 对外入口是宿主机上已有的 OpenResty（按 Host 分流到下面两个站点端口），compose 内不再另设网关；
# 两个前端端口一律绑 127.0.0.1，只对本机可见——绑 0.0.0.0 会让容器直接对公网可达，绕过
# OpenResty 与 Cloudflare（含 Cloudflare Access 对管理端的拦截）。backend 不映射宿主端口。
# 依赖 Compose ≥ 2.17（depends_on 的 restart 字段）：升级 backend 时两个前端自动重启以重新解析
# nginx 上游 IP（proxy_pass 用主机名且未配 resolver，会在配置加载时永久缓存旧 IP，否则升级后 502）
services:
  frontend:
    image: ghcr.io/mintpopai/mintpop-shop/frontend:${FRONTEND_TAG:-latest}   # 版本参数化
    container_name: mintpop-shop-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"   # 宿主端口参数化（右侧容器端口固定），只绑回环
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  admin:
    image: ghcr.io/mintpopai/mintpop-shop/admin:${ADMIN_TAG:-latest}   # 版本参数化
    container_name: mintpop-shop-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8082}:80"   # 宿主端口参数化（右侧容器端口固定），只绑回环
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    image: ghcr.io/mintpopai/mintpop-shop/backend:${BACKEND_TAG:-latest}   # 版本参数化
    container_name: mintpop-shop-backend
    restart: unless-stopped
    volumes:
      - ./application.yml:/app/config/application.yml:ro
    healthcheck:
      # 探公开业务接口（依赖 DB 就绪，即「真可服务」语义）
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/groups >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
