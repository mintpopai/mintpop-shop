# 仅非敏感默认值；数据库连接写在 jar 外的 config/application.yml（gitignore，见 config/application.example.yml）。
# Spring Boot 自动发现工作目录下的 config/application.yml 并覆盖本文件同名配置。
spring:
  application:
    name: mintpop-shop-backend
  web:
    # Accept-Language 缺失或无法识别时的默认语言
    locale: zh-CN
  messages:
    basename: messages
    # 关闭系统语言回退：未支持语言一律落到中文兜底 bundle，不受服务器系统语言影响
    fallback-to-system-locale: false

server:
  port: 8080
  # 生产在反向代理（Cloudflare/nginx）后运行：按 X-Forwarded-* 还原 scheme/host，
  # 保证 post_logout_redirect_uri 拼装与 Cookie Secure 判定正确
  forward-headers-strategy: framework
