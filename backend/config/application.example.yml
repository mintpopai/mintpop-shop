# 复制本文件为同目录 application.yml 并填入你的 MySQL 连接信息。
# config/application.yml 已被 .gitignore 排除，且位于 src/main/resources 之外、不会被打进 jar。
# mise run run-backend 的工作目录是 backend，Spring Boot 启动时会自动读取 ./config/application.yml。
spring:
  datasource:
    # createDatabaseIfNotExist：账号有建库权限时自动创建目标库
    # connectionTimeZone=UTC + forceConnectionTimeZoneToSession=true：把本连接的 MySQL 会话时区强制为 UTC，
    # 使 NOW()/DEFAULT CURRENT_TIMESTAMP 产出 UTC 值，与 JVM（启动类已钉 UTC）同源，不依赖 MySQL 服务器自身时区配置
    url: jdbc:mysql://127.0.0.1:3306/mintpop_shop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: 填用户名
    password: 填密码

  # —— 统一账号中心（Logto，OIDC）——参数向账号中心管理员申请 ——
  security:
    oauth2:
      client:
        provider:
          logto:
            issuer-uri: 填issuer（形如 https://账号中心域名/oidc）
        registration:
          logto:
            client-id: 填client_id
            client-secret: 填client_secret
            scope: openid,profile,email
            # 回调路径按统一账号接入规范固定为 /auth/callback，不要改
            redirect-uri: "{baseUrl}/auth/callback"

  # —— 发货邮件（SMTP）——整段可选：不配则发货照常成功、邮件记为发送失败 ——
  mail:
    host: 填SMTP主机（如 smtp.feishu.cn）
    port: 465
    username: 填发信账号
    password: 填发信口令/应用专用密码
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      # 短超时：发货接口同步等邮件，绝不许被不响应的 SMTP 挂住
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

# —— 自签会话（BFF）——
app:
  auth:
    # HS256 会话签名密钥，至少 32 字节：openssl rand -base64 48
    session-secret: 填会话签名密钥
    # 管理员身份不在这里配：由 shop_user.role 字段判定（USER/ADMIN），直接改库维护，见 README「管理端」章节
    # 以下为可选项及默认值，不改可不写：
    # session-ttl: 7d            # 会话有效期
    # frontend-base-url: /       # 登录/登出完成后回跳的前端地址
    #   ⚠️ 多域部署（商城 mintpop.ai + 管理端 admin.mintpop.ai 各一个子域）下必须保持相对路径 /，
    #   靠 sendRedirect("/") 回跳「当前请求所在的 host」；改成绝对 URL（如 https://mintpop.ai）
    #   会导致管理端登录/登出后被弹回商城域、流程断裂（会话其实已下发在 admin 域上，手动导航回
    #   admin.mintpop.ai 仍是登录态）。不改则默认值天然正确，不要手改。
  # order 整段为可选项及默认值，不改可不写：
  # order:
  #   expire-minutes: 30         # 待支付订单的支付时限（分钟），超时懒惰过期为「已过期」
  mail:
    from: 填发信地址（通常同 username）
    # 以下为可选项及默认值，不改可不写：
    # from-name: MintPop Shop
    # site-base-url: https://mintpop.ai   # 邮件里「查看订单详情」链接的站点前缀
    # default-locale: zh-CN               # 买家未设置语言偏好时的发信语言兜底（BCP47），不影响已设置偏好的买家

# —— 支付（Stripe）——密钥只写进真实 config/application.yml，绝不进仓库 ——
payment:
  stripe:
    secret-key: 填Stripe密钥（sk_ 开头）
    webhook-secret: 填Stripe webhook签名密钥（whsec_ 开头）
    publishable-key: 填Stripe publishable key（pk_ 开头）
    # 以下为可选项及默认值，不改可不写：
    # currency: USD                        # 结算币种（3 位 ISO）
    # supported-types: card,alipay,wxpay   # 启用的支付子方式

# —— 通知（飞书群自定义机器人）——整段可选：不配则不推送 ——
# 获取方式：飞书群设置 → 群机器人 → 添加「自定义机器人」，安全设置勾选「签名校验」
notify:
  feishu:
    webhook-url: 填机器人webhook地址（https://open.feishu.cn/open-apis/bot/v2/hook/ 开头）
    secret: 填签名校验密钥
