name: Release Frontend

on:
  push:
    tags: ["frontend-v*"]
  workflow_dispatch: # 手动逃生口（紧急重推/回滚验证），只推 sha 标签、不建 Release

concurrency:
  group: release-frontend
  cancel-in-progress: false

jobs:
  # 门禁内置到发版：本仓直推 main，构建/推送前必须先过质量检查
  verify:
    uses: ./.github/workflows/quality-frontend.yml

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=frontend-v(.+)
            type=sha,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=auto
      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码（全量历史，COMMIT 模式需要）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 变更日志的比较起点自己算，不用 action 的 tag_resolver.filter：那个 filter 不是「谓词」而是
      # 「转换器」——默认走 name.replace(pattern, "")，结果为空串即视为无值丢弃。于是 "frontend-v.+"
      # 完整匹配 tag 名时，本组件的 tag 反而被全部剔除，连当前 tag 都不在候选里，只能跨组件回退到
      # 别人的上一个 tag（曾导致 frontend-v0.2.0 与 backend-v0.2.0 比较、变更日志为空）。
      - name: 解析上一版同前缀稳定 tag
        id: prev
        env:
          PREFIX: "frontend-"
          TAG: ${{ github.ref_name }}
        run: |
          # shallow clone 下 describe 会静默失准，宁可中止也不产出一份错的变更日志
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] \
            || { echo "::error::仓库是 shallow clone，checkout 需 fetch-depth: 0" >&2; exit 1; }
          # 按提交拓扑回溯最近的同前缀稳定 tag：
          #   --match   只认本组件、v 后跟数字的 tag        --exclude 排除预发布（如 v0.2.0-rc.1）
          #   ${TAG}^ 从父提交起找，同 commit 上别的组件 tag 不会干扰
          prev="$(git describe --tags --abbrev=0 \
            --match "${PREFIX}v[0-9]*" --exclude "${PREFIX}v*-*" "${TAG}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            # 没找到时区分「真首发」与「异常」，绝不一律退成全量历史
            others="$(git tag -l "${PREFIX}v[0-9]*" \
              | grep -E "^${PREFIX}v[0-9]+\.[0-9]+\.[0-9]+$" | grep -vFx "${TAG}" || true)"
            if [ -n "$others" ]; then
              echo "::error::存在同前缀稳定 tag 却回溯不到上一版，疑似 tag 不在当前历史或未拉全" >&2
              printf '%s\n' "$others" >&2
              exit 1
            fi
            prev="$(git rev-list --max-parents=0 "${TAG}" | tail -1)"   # 真首发：起点取初始提交
            echo "首发，起点取初始提交 ${prev}" >&2
          fi
          echo "起点 ${prev} → 终点 ${TAG}" >&2
          echo "from=$prev" >> "$GITHUB_OUTPUT"
      - name: 生成分类变更日志
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: COMMIT
          fromTag: ${{ steps.prev.outputs.from }}
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "categories": [
                { "title": "## 新功能", "labels": ["feat"] },
                { "title": "## 修复", "labels": ["fix"] },
                { "title": "## 性能", "labels": ["perf"] },
                { "title": "## 重构", "labels": ["refactor"] },
                { "title": "## 回滚", "labels": ["revert"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|perf|refactor|revert|build|chore|ci|docs|style|test)[^:]*:.*",
                  "target": "$1",
                  "on_property": "title"
                }
              ],
              "template": "#{{CHANGELOG}}"
            }
      - name: 组装 Release 正文（tag 注释置顶 + 空正文兜底）
        env:
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          : > notes.md
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" >> notes.md; printf '\n\n' >> notes.md
          fi
          printf '%s\n' "$CHANGELOG" >> notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "- 本次无面向用户的变更" > notes.md
          fi
          echo "RELEASE_NAME=MintPop Shop frontend v${TAG#frontend-v}" >> "$GITHUB_ENV"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: notes.md
