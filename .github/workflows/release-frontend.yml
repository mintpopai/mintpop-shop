name: Release Frontend

on:
  push:
    tags: ["frontend-v*"]
  workflow_dispatch: # 手动逃生口（紧急重推/回滚验证），只推 sha 标签、不建 Release

concurrency:
  group: release-frontend
  cancel-in-progress: false

jobs:
  # 门禁内置到发版：本仓直推 main，构建/推送前必须先过质量检查
  verify:
    uses: ./.github/workflows/quality-frontend.yml

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=frontend-v(.+)
            type=sha,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=auto
      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码（全量历史，COMMIT 模式需要）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # 变更日志的比较起点自己算，不用 action 的 tag_resolver.filter：那个 filter 不是「谓词」而是
      # 「转换器」——默认走 name.replace(pattern, "")，结果为空串即视为无值丢弃。于是 "frontend-v.+"
      # 完整匹配 tag 名时，本组件的 tag 反而被全部剔除，连当前 tag 都不在候选里，只能跨组件回退到
      # 别人的上一个 tag（曾导致 frontend-v0.2.0 与 backend-v0.2.0 比较、变更日志为空）。
      - name: 解析上一版同前缀 tag
        id: prev
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # git 版本序（禁 sort -V，macOS 不支持）取「同前缀、紧邻当前 tag 的下一个」
          prev="$(git tag -l 'frontend-v*' --sort=-v:refname \
            | awk -v cur="$TAG" 'f { print; exit } $0 == cur { f = 1 }')"
          if [ -z "$prev" ]; then
            # 首发（无上一版）：起点取初始提交，等价于「取全量历史」
            prev="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "未找到上一版 frontend tag，按首发处理，起点取初始提交 ${prev}"
          fi
          echo "起点 ${prev} → 终点 ${TAG}"
          echo "from=$prev" >> "$GITHUB_OUTPUT"
      - name: 生成分类变更日志
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: COMMIT
          fromTag: ${{ steps.prev.outputs.from }}
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "categories": [
                { "title": "## 新功能", "labels": ["feat"] },
                { "title": "## 修复", "labels": ["fix"] },
                { "title": "## 性能", "labels": ["perf"] },
                { "title": "## 重构", "labels": ["refactor"] },
                { "title": "## 回滚", "labels": ["revert"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|perf|refactor|revert|build|chore|ci|docs|style|test)[^:]*:.*",
                  "target": "$1",
                  "on_property": "title"
                }
              ],
              "template": "#{{CHANGELOG}}"
            }
      - name: 组装 Release 正文（tag 注释置顶 + 空正文兜底）
        env:
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          : > notes.md
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" >> notes.md; printf '\n\n' >> notes.md
          fi
          printf '%s\n' "$CHANGELOG" >> notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "- 本次无面向用户的变更" > notes.md
          fi
          echo "RELEASE_NAME=MintPop Shop frontend v${TAG#frontend-v}" >> "$GITHUB_ENV"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: notes.md
