name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "mise.toml"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/quality-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "mise.toml"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/quality-frontend.yml"

jobs:
  quality:
    uses: ./.github/workflows/quality-frontend.yml
