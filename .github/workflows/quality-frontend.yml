# 复用型质量门禁（workflow_call）：CI 与发版 workflow 共用，改一处两边生效
name: Quality Frontend

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 mise 工具链
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - name: 安装前端依赖（按 lockfile 精确安装）
        run: mise run install-frontend --frozen
      - name: 类型检查并构建前端
        run: mise run build-frontend
