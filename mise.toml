[tools]
java = "temurin-21.0.11+10.0.LTS"
maven = "3.9.16"
node = "24.18.0"
pnpm = "11.12.0"
# Stripe CLI：本地联调 webhook 用（stripe listen 转发回调到本地，无需公网 IP）
stripe = "1.43.8"

# —— 安装 ——
[tasks.install]
description = "安装全部组件依赖"
depends = ["install-backend", "install-frontend", "install-admin"]

[tasks.install-backend]
description = "预热 后端 Maven 依赖（Docker 依赖层缓存用；本地按需）"
dir = "backend"
run = "mvn -B -q dependency:go-offline"

[tasks.install-frontend]
description = "安装 前端依赖"
usage = '''
flag "--frozen" help="按 lockfile 精确安装、不更新 lockfile（CI/Docker 用）"
'''
dir = "frontend"
run = "pnpm install ${usage_frozen:+--frozen-lockfile}"

[tasks.install-admin]
description = "安装 管理端依赖"
usage = '''
flag "--frozen" help="按 lockfile 精确安装、不更新 lockfile（CI/Docker 用）"
'''
dir = "admin"
run = "pnpm install ${usage_frozen:+--frozen-lockfile}"

# —— 运行 ——
[tasks.run-backend]
description = "启动 后端（Spring Boot，端口 8080）"
dir = "backend"
run = "mvn spring-boot:run"

[tasks.run-frontend]
description = "启动 前端开发服务器（Vite，/api 代理到 8080）"
dir = "frontend"
run = "pnpm vite"

[tasks.run-admin]
description = "启动 管理端开发服务器（Vite 5174，/api 代理到 8080）"
dir = "admin"
run = "pnpm vite"

[tasks.webhook-listen]
description = "本地联调：把 Stripe 沙盒 webhook 事件转发到本地后端（首次先 stripe login；启动时打印的 whsec_ 填本地配置）"
run = "stripe listen --forward-to localhost:8080/api/v1/payment/webhook/stripe --events payment_intent.succeeded,payment_intent.payment_failed"

[tasks.up]
description = "启动 compose 部署（拉取已发布镜像运行）"
run = "docker compose up -d"

[tasks.down]
description = "停止 compose 部署"
run = "docker compose down"

# —— 构建 ——
[tasks.build-backend]
description = "构建 后端 jar"
dir = "backend"
run = "mvn -DskipTests package"

[tasks.build-frontend]
description = "类型检查并构建 前端产物"
dir = "frontend"
run = "pnpm vue-tsc --noEmit && pnpm vite build"

[tasks.build-admin]
description = "类型检查并构建 管理端产物"
dir = "admin"
run = "pnpm vue-tsc --noEmit && pnpm vite build"

[tasks.image-backend]
description = "构建 后端镜像（backend/Dockerfile，mise 多阶段，context=仓库根）"
run = "docker build -f backend/Dockerfile -t mintpop-shop-backend:local ."

[tasks.image-frontend]
description = "构建 前端镜像（frontend/Dockerfile，mise 多阶段，context=仓库根）"
run = "docker build -f frontend/Dockerfile -t mintpop-shop-frontend:local ."

# —— 质量 ——
[tasks.test-backend]
description = "运行 后端单元测试"
dir = "backend"
run = "mvn test"

# —— 发版 ——
# 共用逻辑收口在隐藏任务 release，release-backend / release-frontend 只负责传组件名，
# 两个组件的发版流程永远是同一份定义、不漂移
[tasks.release]
hide = true
description = "发版共用逻辑（内部）：校验→同步版本号文件→打 tag→先推 main 再推 tag"
usage = '''
arg "<component>" help="组件（backend / frontend）"
arg "[arg1]" help="版本号（vX.Y.Z）或更新说明，单参数按形状消歧；缺省取最新稳定 tag 的 patch+1"
arg "[arg2]" help="更新说明（第一个参数为版本号时用）"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

component="${usage_component:?}"
arg1="${usage_arg1:-}"
arg2="${usage_arg2:-}"

case "$component" in
  backend|frontend) ;;
  *) echo "未知组件：${component}（只支持 backend / frontend）" >&2; exit 1 ;;
esac

ver_re='^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'

# —— 参数消歧：两个都传 → 版本号+说明；只传一个 → 按形状判定 ——
version=""
notes=""
if [[ -n "$arg2" ]]; then
  version="$arg1"
  notes="$arg2"
  [[ "$version" =~ $ver_re ]] || { echo "第一个参数不是合法版本号：${version}" >&2; exit 1; }
elif [[ -n "$arg1" ]]; then
  if [[ "$arg1" =~ $ver_re ]]; then version="$arg1"; else notes="$arg1"; fi
fi

# 这次 fetch 同时供「自动算版本号」与「main 落后检查」复用
git fetch origin main --tags

# —— 发版前校验，任一不过即中止、绝不打 tag ——
branch="$(git rev-parse --abbrev-ref HEAD)"
[[ "$branch" == "main" ]] || { echo "当前不在 main（在 ${branch}），中止" >&2; exit 1; }
[[ -z "$(git status --porcelain)" ]] || { echo "工作区不干净，中止" >&2; exit 1; }
[[ -z "$(git rev-list HEAD..origin/main)" ]] || { echo "本地 main 落后 origin/main，先 git pull，中止" >&2; exit 1; }

# —— 缺省版本号：最新稳定 tag 的 patch+1（git 内置版本排序，禁 sort -V）——
if [[ -z "$version" ]]; then
  latest="$(git tag -l "${component}-v*" --sort=-v:refname \
    | grep -E "^${component}-v[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)"
  if [[ -z "$latest" ]]; then
    version="v0.1.0"
  else
    base="${latest#"${component}"-v}"
    IFS=. read -r major minor patch <<< "$base"
    version="v${major}.${minor}.$((patch + 1))"
  fi
fi
version="v${version#v}"
tag="${component}-${version}"

git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
  && { echo "tag 已存在：${tag}，中止" >&2; exit 1; }

# —— 同步版本号文件并提交（chore 前缀，不进变更日志）——
bare="${version#v}"
case "$component" in
  frontend)
    (cd frontend && pnpm version "$bare" --no-git-tag-version --allow-same-version)
    ;;
  backend)
    (cd backend && mvn -B -q versions:set -DnewVersion="$bare" -DgenerateBackupPoms=false)
    ;;
esac
if [[ -n "$(git status --porcelain)" ]]; then
  git add -A
  git commit -m "chore(${component}): 版本号更新为 ${bare}"
fi

# —— 打 tag（有说明 annotated / 无说明轻量），先推 main 再推 tag ——
if [[ -n "$notes" ]]; then
  git tag -a "$tag" -m "$notes"
else
  git tag "$tag"
fi
git push origin main && git push origin "$tag"
echo "已发版：${tag}（Release 由 tag 触发）"
'''

[tasks.release-backend]
description = "发版 后端：校验→同步 pom 版本→打 tag→推送（tag 触发 Release Backend）"
usage = '''
arg "[arg1]" help="版本号（vX.Y.Z）或更新说明，单参数按形状消歧；缺省取最新稳定 tag 的 patch+1"
arg "[arg2]" help="更新说明（第一个参数为版本号时用）"
'''
run = 'mise run release backend "${usage_arg1:-}" "${usage_arg2:-}"'

[tasks.release-frontend]
description = "发版 前端：校验→同步 package.json 版本→打 tag→推送（tag 触发 Release Frontend）"
usage = '''
arg "[arg1]" help="版本号（vX.Y.Z）或更新说明，单参数按形状消歧；缺省取最新稳定 tag 的 patch+1"
arg "[arg2]" help="更新说明（第一个参数为版本号时用）"
'''
run = 'mise run release frontend "${usage_arg1:-}" "${usage_arg2:-}"'
